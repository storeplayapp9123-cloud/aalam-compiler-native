plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aalam.compiler'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.aalam.compiler'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// android.jar ko assets me copy karta hai (ECJ step ko chahiye)
tasks.register('copyAndroidJar', Copy) {
    def jar = new File(android.sdkDirectory, 'platforms/android-34/android.jar')
    doFirst {
        if (!jar.isFile()) throw new GradleException('android.jar nahi mila: ' + jar)
    }
    from(jar)
    into('src/main/assets')
}

tasks.named('preBuild') {
    dependsOn 'copyAndroidJar'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ECJ: sirf Java source compile step ke liye, JNI callback se
    implementation 'org.eclipse.jdt:ecj:3.26.0'
}
