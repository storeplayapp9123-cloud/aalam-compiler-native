name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK + CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Fetch aapt2 (Android arm64, prebuilt, no manual steps needed)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L -o app/src/main/jniLibs/arm64-v8a/libaapt2.so \
            https://github.com/revanced/revanced-manager/raw/main/android/app/src/main/jniLibs/arm64-v8a/libaapt2.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libaapt2.so

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aalam-compiler-native-debug
          path: app/build/outputs/apk/debug/*.apk
